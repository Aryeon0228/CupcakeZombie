<title>컵케익 좀비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: a phone-shaped app — title, stage map, and a play screen with the muffin-tin board above a thumb-reach control bar. Sheets slide up from the bottom. Single deliberate light look: a bakery in daylight. */
:root {
  --cloth: #EDE3D2;
  --cloth-stripe: rgba(140, 168, 128, 0.14);
  --ink: #4A2E27;
  --ink-soft: #7C5D51;
  --paper: #FFF9F2;
  --paper-edge: #EBD9CC;
  --mold: #93B743;
  --mold-deep: #5B7A21;
  --mold-soft: #E4F0C6;
  --cherry: #DB4B58;
  --star: #F2B53A;
  --f-display: 'Jua', 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --f-body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --r-sticker: 18px 14px 20px 13px;
  --r-card: 22px 16px 24px 15px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  word-break: keep-all; overflow-wrap: anywhere; text-wrap: pretty; /* Korean breaks between words, never inside one */
  background-color: var(--cloth);
  background-image: linear-gradient(90deg, var(--cloth-stripe) 50%, transparent 50%), linear-gradient(var(--cloth-stripe) 50%, transparent 50%);
  background-size: 44px 44px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; touch-action: manipulation; }

#app { position: fixed; inset: 0; }
.screen {
  position: absolute; inset: 0; margin: 0 auto; width: 100%; max-width: 560px;
  display: flex; flex-direction: column; min-height: 0;
  padding-top: var(--sat);
  opacity: 0; pointer-events: none; transition: opacity .18s ease;
}
.screen.on { opacity: 1; pointer-events: auto; }
.eyebrow { font-family: var(--f-display); font-size: 13px; letter-spacing: .1em; color: var(--mold-deep); }
.small { font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 6px 14px;
  border: 2px solid var(--ink); border-radius: var(--r-sticker);
  background: var(--paper); box-shadow: 2px 3px 0 var(--ink);
  font-family: var(--f-display); font-size: 16px; cursor: pointer; line-height: 1.2;
  transition: transform .08s ease, box-shadow .08s ease;
}
.btn:active { transform: translate(2px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn:focus-visible { outline: 3px solid var(--mold); outline-offset: 2px; }
.btn[disabled] { opacity: .45; cursor: default; transform: none; box-shadow: 2px 3px 0 var(--ink); }
.btn.go { background: var(--mold); }
.btn.quiet { background: transparent; box-shadow: none; border-color: transparent; color: var(--ink-soft); }
.btn.big { width: 100%; min-height: 54px; font-size: 19px; }
.btn.small { min-height: 36px; min-width: 36px; font-size: 14px; padding: 3px 10px; box-shadow: 2px 2px 0 var(--ink); }
.btn .k { font-family: var(--f-body); font-size: 12px; color: var(--ink-soft); border: 1px solid var(--paper-edge); border-radius: 6px; padding: 0 6px; background: #fff; }
.btn svg { flex: none; }
.chip { font-family: var(--f-display); font-size: 12px; color: #fff; background: var(--mold-deep); border-radius: 8px; padding: 1px 8px; margin-left: 6px; }

/* ---- title ---- */
.title-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 24px 20px calc(20px + var(--sab)); }
.logo-big { position: relative; align-self: center; flex: none; width: min(520px, calc(100% + 40px)); text-align: center; }
.logo-art { width: 100%; aspect-ratio: 3 / 2; overflow: hidden; }
.logo-art img { display: block; width: 111.111111%; max-width: none; height: auto; transform: translate(-5%, -3.225806%); }
/* The approved artwork contains the title; retain the localized heading for screen readers. */
.logo-big h1 { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.logo-big p { max-width: 310px; margin: 6px auto 0; padding: 6px 10px; border-radius: 10px; background: rgba(255,249,242,.82); color: var(--ink-soft); font-size: 13.5px; text-wrap: balance; }
.title-btns { display: grid; gap: 12px; }
.row-mini { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 2px; }
.foot { font-size: 12px; color: var(--ink-soft); text-align: center; }

/* ---- bars & map ---- */
.bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
.bar h2 { margin: 0; flex: 1; font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.bar-title { flex: 1; min-width: 0; line-height: 1.2; }
.bar-title .name { font-family: var(--f-display); font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scroll { flex: 1; overflow-y: auto; padding: 0 16px calc(24px + var(--sab)); -webkit-overflow-scrolling: touch; }
.chapter { background: var(--paper); border: 2px solid var(--ink); border-radius: var(--r-card); box-shadow: 3px 4px 0 var(--ink); padding: 14px; margin-bottom: 16px; }
.chap-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 10px; }
.chap-head .small { margin-left: auto; white-space: nowrap; }
.chap-head h3 { margin: 0; flex: 0 1 auto; white-space: nowrap; font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.stage-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px 8px; }
.map-nav { display: flex; gap: 8px; align-items: center; padding: 8px 16px; background: var(--paper); }
.map-nav select { min-width: 0; flex: 1; min-height: 44px; border: 2px solid var(--ink); border-radius: 12px; padding: 6px; color: var(--ink); background: var(--paper); font: inherit; font-size: 13px; }
.map-nav .btn { min-height: 44px; font-size: 12px; padding: 6px 10px; }
/* shelf map: cupcakes standing on wooden planks */
.chapter.shelf { padding: 12px 10px 14px; }
.chap-head { align-items: center; margin-bottom: 4px; padding: 0 4px; }
.chap-face { width: 38px; height: 41px; object-fit: contain; object-position: bottom; flex: none; }
.chap-text { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.chap-text .eyebrow { line-height: 1.1; }
.plank { display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; position: relative; padding: 8px 0 0; margin-bottom: 2px; }
.plank::before { content: ''; position: absolute; left: 0; right: 0; bottom: 19px; height: 9px; border-radius: 3px; background: linear-gradient(#dcb27f, #b98556 60%, #a37046); border: 1.5px solid var(--ink); box-shadow: 0 4px 0 -1px #6e4529, 0 8px 10px -2px rgba(74, 46, 39, 0.25); }
.stage-btn { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 0; padding: 0; width: 100%; border: 0; background: none; box-shadow: none; border-radius: 10px; cursor: pointer; font-family: var(--f-display); -webkit-tap-highlight-color: transparent; }
.stage-btn .art { position: relative; width: 100%; aspect-ratio: 66 / 74; display: block; }
.stage-btn .cake { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; display: block; transition: transform .15s ease; }
.stage-btn:active .cake { transform: translateY(2px) scale(0.97); }
.stage-btn .n { font-size: 12px; line-height: 1; color: var(--ink-soft); margin-top: 13px; font-variant-numeric: tabular-nums; }
.stage-btn .st { position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); font-size: 10px; line-height: 1; letter-spacing: -1px; padding: 2px 4px 1px; border-radius: 8px; background: rgba(255, 249, 242, 0.92); border: 1px solid var(--ink); white-space: nowrap; }
.stage-btn .st .on { color: #E6A93A; } .stage-btn .st .off { color: #D9CFC4; }
.stage-btn.next-stage { outline: none; }
.stage-btn.next-stage .n { color: var(--mold-deep); font-weight: 700; }
.stage-btn.next-stage .art::before { content: ''; position: absolute; left: 50%; bottom: -1px; width: 80%; height: 14px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse at center, rgba(147, 183, 67, 0.75), rgba(147, 183, 67, 0) 70%); }
.stage-btn .spore { position: absolute; left: 50%; top: -14px; width: 22px; height: 22px; margin-left: -11px; animation: shelf-spore 1.6s ease-in-out infinite; filter: drop-shadow(0 2px 1px rgba(74, 46, 39, 0.25)); }
@keyframes shelf-spore { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-6px) rotate(6deg); } }
.stage-btn.locked { cursor: default; }
.stage-btn.locked .n { color: #B9A89C; }
.stage-btn .cloche { position: absolute; left: 50%; bottom: 0; width: 84%; height: 92%; transform: translateX(-50%); border-radius: 30px 30px 6px 6px / 34px 34px 4px 4px; background: linear-gradient(100deg, rgba(255, 255, 255, 0.55), rgba(220, 235, 245, 0.18) 45%, rgba(255, 255, 255, 0.42)); border: 1.5px solid rgba(74, 46, 39, 0.55); box-shadow: inset 2px 0 3px rgba(255, 255, 255, 0.7), inset -2px -2px 3px rgba(120, 140, 160, 0.25); }
.stage-btn .cloche::before { content: ''; position: absolute; left: 50%; top: -7px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #d8b58a; border: 1.5px solid rgba(74, 46, 39, 0.6); }
.stage-btn .cloche::after { content: ''; position: absolute; left: 9px; top: 9px; width: 7px; height: 26px; border-radius: 6px; background: rgba(255, 255, 255, 0.75); transform: rotate(8deg); }
@media (prefers-reduced-motion: reduce) { .stage-btn .spore { animation: none; } }
.st i, .starline i, .bigstars span { font-style: normal; }
i.on { color: var(--star); -webkit-text-stroke: 1px var(--ink); }
i.off { color: var(--paper-edge); -webkit-text-stroke: 1px var(--ink-soft); }

/* ---- play ---- */
.bg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; display: block; }
.screen { z-index: 1; }
#app { overflow: hidden; }
#app.has-bg { background: #E3D6C2; }
#app.has-bg .title-wrap { padding-top: clamp(44px, 9dvh, 80px); justify-content: flex-start; gap: 18px; }
#app.has-bg .chapter { box-shadow: 3px 4px 0 var(--ink); }
#app.has-bg #scr-map > .bar { background: rgba(255, 249, 242, 0.6); border-radius: 14px; backdrop-filter: blur(3px); }
#scr-play > .bar, #scr-play > .board-wrap, #scr-play > .hintline, #scr-play > .hud { position: relative; z-index: 1; }
#scr-play.has-bg > .bar { background: rgba(255, 249, 242, 0.55); backdrop-filter: blur(3px); }
#scr-play.has-bg > .hud { background: rgba(255, 249, 242, 0.84); backdrop-filter: blur(4px); }
#scr-play.has-bg > .hintline { margin: 0 14px 4px; background: rgba(255, 249, 242, 0.7); border-radius: 12px; backdrop-filter: blur(3px); }
#scr-play.has-bg > .hintline:empty { background: transparent; backdrop-filter: none; }
.board-wrap { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; padding: 4px 10px; }
#board { display: block; touch-action: none; border-radius: 12px; max-width: 100%; user-select: none; -webkit-user-select: none; }
#board:focus-visible { outline: 3px dashed var(--mold-deep); outline-offset: 4px; }
.sent { display: inline-block; }
/* Reserve three lines, including padding. Hover, selection and busy copy must
   not resize the tray or change the cell underneath a stationary pointer. */
.hintline { flex: 0 0 auto; height: calc(4.2em + 12px); min-height: calc(4.2em + 12px); overflow-y: auto; overscroll-behavior: contain; text-wrap: balance; padding: 6px 18px; font-size: 13px; color: var(--ink-soft); text-align: center; line-height: 1.4; }
.hintline b { font-family: var(--f-display); font-weight: 400; color: var(--ink); margin-right: 6px; }
.selection-tip { display: block; color: var(--mold-deep); font-size: 0.92em; }
.hud {
  background: var(--paper); border-top: 2px solid var(--ink);
  padding: 10px 16px calc(12px + var(--sab)); display: grid; gap: 8px; position: relative;
}
.hud-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pips { display: flex; gap: 7px; align-items: center; min-height: 38px; flex-shrink: 0; }
.pips .mold { width: 44px; height: auto; display: block; margin: -4px 0 -2px -4px; transform-origin: 50% 100%; }
.spore-readout { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; white-space: nowrap; }
.spore-label { font-size: 11px; font-weight: 700; color: var(--ink-soft); line-height: 1.2; }
.spore-value { display: flex; align-items: baseline; gap: 3px; color: var(--mold-deep); line-height: 1; }
.spore-count { min-width: 1ch; font-family: var(--f-display); font-size: 26px; font-weight: 400; font-variant-numeric: tabular-nums; }
.spore-unit { font-size: 12px; font-weight: 700; }
.pips.empty .spore-value { color: var(--ink); }
.pips .mold.puff { animation: puff .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes puff { 0% { transform: scale(1, 1); } 30% { transform: scale(1.18, .8); } 60% { transform: scale(.9, 1.12) translateY(-6px); } 100% { transform: scale(1, 1); } }
.starline { display: flex; align-items: center; gap: 6px; min-width: 0; }
#starText { text-wrap: balance; }
.starline .st { white-space: nowrap; flex-shrink: 0; font-family: var(--f-display); font-size: 20px; letter-spacing: 1px; line-height: 1; }
@media (max-width: 360px) { .starline { flex-direction: column; align-items: flex-end; gap: 3px; } #starText { text-align: right; font-size: 10px; } .pips .mold { width: 38px; } }
.hud-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.hud-btn { display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.hud-btn .bi { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#hintBtn .bi { color: #c8901c; }
@media (max-width: 360px) { .hud-btn { gap: 4px; font-size: 14px; } .hud-btn .bi { width: 17px; height: 17px; } }

/* ---- sheets ---- */
[hidden] { display: none !important; }
.sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: rgba(74, 46, 39, .35); opacity: 0; transition: opacity .2s ease; }
.sheet.open { opacity: 1; }
.sheet.modal { align-items: center; padding: 16px; }
.sheet-card {
  width: 100%; max-width: 560px; max-height: 86%; overflow-y: auto;
  background: var(--paper); border: 2px solid var(--ink); border-bottom: 0; border-radius: 24px 24px 0 0;
  padding: 16px 18px calc(18px + var(--sab)); display: grid; gap: 10px;
  transform: translateY(40px); transition: transform .22s ease;
}
.sheet.open .sheet-card { transform: none; }
.sheet.modal .sheet-card { border-bottom: 2px solid var(--ink); border-radius: var(--r-card); box-shadow: 4px 5px 0 var(--ink); padding-bottom: 18px; text-align: center; justify-items: center; }
.sheet-card h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.15; text-wrap: balance; }
.sheet-card p { margin: 0; color: var(--ink-soft); text-wrap: balance; }
.sheet-card .row { display: flex; gap: 10px; flex-wrap: wrap; }
.sheet-card .row .btn { flex: 1 1 40%; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-head .btn { white-space: nowrap; flex-shrink: 0; }
.center { text-align: center; justify-items: center; }
/* Keep the completed board within reach without a competing footer action. */
.result-card { position: relative; padding: 20px 22px calc(24px + var(--sab)); gap: 12px; }
.result-card #resEyebrow { min-height: 24px; padding: 0 40px; align-content: center; }
.result-card #resBtns { width: 100%; max-width: 400px; gap: 12px; margin-top: 6px; }
.result-card #resBtns .btn { min-height: 48px; }
.result-card #cardRewards { max-width: 100%; min-width: 0; }
.result-dismiss {
  position: absolute; top: 8px; right: 8px; display: grid; place-items: center;
  width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
  background: transparent; color: var(--ink-soft); cursor: pointer;
}
.result-dismiss:focus-visible { outline: 3px solid var(--mold); outline-offset: -3px; }
.result-dismiss:active { background: var(--paper-edge); }
@media (hover: hover) { .result-dismiss:hover { background: var(--paper-edge); } }
.win h2 { color: var(--mold-deep); }
.lose h2 { color: var(--cherry); }
.bigstars { display: flex; gap: 6px; font-family: var(--f-display); font-size: 44px; line-height: 1; justify-content: center; }
.bigstars span { color: var(--paper-edge); -webkit-text-stroke: 2px var(--ink); display: inline-block; }
.bigstars span.on { color: var(--star); animation: starpop .45s cubic-bezier(.3, 1.8, .5, 1) both; }
.res-chapter { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 2px 0 4px; padding: 8px 12px; border: 2px dashed var(--ink); border-radius: 14px; background: var(--mold-soft); font-size: 13px; }
.res-chapter > span { display: flex; align-items: center; gap: 6px; min-width: 0; }
.res-chapter img { width: 34px; height: 38px; object-fit: contain; object-position: bottom; flex: none; }
.res-chapter b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 15px; line-height: 1.15; }
.res-chapter small { display: block; font-size: 11px; color: var(--ink-soft); line-height: 1.2; }
.res-chapter .rc-arrow { color: var(--mold-deep); font-family: var(--f-display); font-size: 20px; }
.res-chapter .rc-next { opacity: .8; }
/* collected cards flip in one after another */
.reward-card { animation: reward-flip .62s cubic-bezier(.2, .8, .25, 1) both; }
.reward-card:nth-child(2) { animation-delay: .14s; } .reward-card:nth-child(3) { animation-delay: .28s; }
@keyframes reward-flip { 0% { transform: perspective(500px) rotateY(-100deg) scale(.86); opacity: 0; } 55% { transform: perspective(500px) rotateY(12deg) scale(1.03); opacity: 1; } 100% { transform: none; opacity: 1; } }
.reward-card small { animation: reward-pop .4s .5s cubic-bezier(.3, 1.8, .5, 1) both; }
@keyframes reward-pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .reward-card, .reward-card small { animation: none; } }
.bigstars span:nth-child(2).on { animation-delay: .15s; }
.bigstars span:nth-child(3).on { animation-delay: .3s; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.switch { appearance: none; width: 50px; height: 30px; border-radius: 15px; background: var(--paper-edge); border: 2px solid var(--ink); position: relative; cursor: pointer; margin: 0; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); transition: transform .15s; }
.switch:checked { background: var(--mold); }
.switch:checked::after { transform: translateX(20px); }
.confirm { background: #fff; border: 1.5px solid var(--paper-edge); border-radius: 12px; padding: 10px; display: grid; gap: 8px; }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; background: #fff; }
.segbtn { border: 0; background: transparent; padding: 6px 12px; font-family: var(--f-display); font-size: 14px; cursor: pointer; min-height: 36px; }
.segbtn + .segbtn { border-left: 2px solid var(--ink); }
.segbtn.on { background: var(--mold); }

/* intro card */
.overlay { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; padding: 16px; background: rgba(255, 249, 242, 0.6); backdrop-filter: blur(2px); animation: fadein .25s ease; }
.card {
  width: min(380px, 100%); background: var(--paper); border: 2px solid var(--ink); border-radius: var(--r-card); box-shadow: 4px 5px 0 var(--ink);
  padding: 20px 20px 18px; text-align: center; display: grid; gap: 8px; justify-items: center; animation: popin .35s cubic-bezier(.3, 1.6, .5, 1);
}
.card h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1.15; }
.card p { margin: 0; color: var(--ink-soft); text-wrap: balance; }
.card .tag { font-family: var(--f-display); font-size: 13px; color: #fff; background: var(--cherry); border-radius: 10px; padding: 1px 10px; }
.card .art { display: flex; align-items: flex-end; justify-content: center; gap: 14px; min-height: 104px; }
.card .art img, .card .art canvas { height: 104px; width: auto; }
.card .art svg { width: 92px; height: 92px; }

/* legend */
.legend { display: grid; gap: 8px; }
.leg { display: grid; grid-template-columns: 40px 1fr 42px; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 12px; background: #fff; border: 1.5px solid var(--paper-edge); }
.leg img, .leg .ico { width: 38px; height: 38px; object-fit: contain; }
.leg .txt { min-width: 0; font-size: 12.5px; line-height: 1.4; color: var(--ink-soft); }
.leg .txt b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 15px; color: var(--ink); }
.leg svg { width: 42px; height: 42px; display: block; }
.leg .new { font-family: var(--f-display); font-size: 11px; color: #fff; background: var(--cherry); border-radius: 8px; padding: 0 6px; margin-left: 4px; vertical-align: 2px; }

.toast { position: fixed; left: 50%; bottom: calc(120px + var(--sab)); transform: translate(-50%, 10px); z-index: 40; background: var(--ink); color: var(--paper); font-family: var(--f-display); padding: 8px 16px; border-radius: 14px; opacity: 0; transition: all .2s; max-width: 90%; text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@keyframes fadein { from { opacity: 0 } }
@keyframes popin { from { transform: scale(.85); opacity: 0 } }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } }
@media (prefers-reduced-motion: reduce) { .overlay, .card, .bigstars span.on, .pips .mold { animation: none; } .btn, .sheet, .sheet-card { transition: none; } }
@media (max-height: 700px) {
  .hintline { font-size: 12px; }
  .logo-big p { font-size: 12px; }
  #app.has-bg .title-wrap { padding-top: 28px; gap: 12px; }
}
@media (max-height: 600px) {
  #app.has-bg .title-wrap { padding-top: 16px; gap: 10px; }
}
